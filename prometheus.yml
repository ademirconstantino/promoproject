global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "promoproject"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["promoproject:8080"]

  - job_name: "kafka"
    static_configs:
      - targets: ["kafka-exporter:9308"]

  - job_name: "mongodb"
    static_configs:
      - targets: ["mongodb-exporter:9216"]