apiVersion: apps/v1
kind: Deployment
metadata:
  name: promoproject-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: promoproject
  template:
    metadata:
      labels:
        app: promoproject
    spec:
      containers:
        - name: promoproject
          image: promoproject
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: promoproject-service
spec:
  type: NodePort
  selector:
    app: promoproject
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080