# Kafka UI, served under the /ui path
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-ui
  namespace: promoproject
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-ui
  template:
    metadata:
      labels:
        app: kafka-ui
    spec:
      enableServiceLinks: false
      containers:
        - name: kafka-ui
          image: provectuslabs/kafka-ui:latest
          ports:
            - containerPort: 8080
          env:
            - { name: KAFKA_CLUSTERS_0_NAME, value: "local" }
            - { name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS, value: "kafka:9092" }
            - { name: SERVER_SERVLET_CONTEXT_PATH, value: "/ui" }
            - { name: DYNAMIC_CONFIG_ENABLED, value: "true" }
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-ui
  namespace: promoproject
spec:
  selector:
    app: kafka-ui
  ports:
    - port: 8080
      targetPort: 8080
