# MongoDB (single instance, data kept in a PersistentVolumeClaim)
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-credentials
  namespace: promoproject
type: Opaque
stringData:
  username: admin
  password: admin123
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongodb-data
  namespace: promoproject
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: promoproject
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
        - name: mongodb
          # MongoDB 5.0+ needs a CPU with AVX. On older CPUs (e.g. Core 2 Duo)
          # makeit.sh --local swaps this for mongo:4.4 automatically.
          image: mongo:7
          # Keep the WiredTiger cache small; by default it takes half of the RAM
          args: ["--wiredTigerCacheSizeGB", "0.25"]
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef: { name: mongodb-credentials, key: username }
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: mongodb-credentials, key: password }
          # A TCP check works on every MongoDB image (mongo:4.4 has no mongosh)
          readinessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { memory: "256Mi", cpu: "100m" }
            limits:   { memory: "512Mi" }
          volumeMounts:
            - name: data
              mountPath: /data/db
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mongodb-data
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: promoproject
spec:
  selector:
    app: mongodb
  ports:
    - port: 27017
      targetPort: 27017
